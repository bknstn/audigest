[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "audigest"
dynamic = ["version"]
description = "A CLI for reusable transcripts and focused outputs from spoken media"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "platformdirs>=4.2",
  "pydantic>=2.8",
  "typer>=0.12",
]

[project.optional-dependencies]
openai = ["openai>=2,<3"]
youtube = ["yt-dlp>=2025.11.12"]
elevenlabs = ["elevenlabs>=2.75.0,<3"]
local = ["faster-whisper>=1.2.1,<2"]

[project.scripts]
audigest = "audigest.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audigest"]

[tool.hatch.version]
path = "src/audigest/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/audigest"]
strict = true
